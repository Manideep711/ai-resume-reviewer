spring.application.name=resume-reviewer
server.port=${PORT:8080}
server.address=0.0.0.0

groq.api.key=${GROQ_API_KEY}
groq.api.url=https://api.groq.com/openai/v1
groq.api.model=openai/gpt-oss-120b

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Drain a rejected bounded upload so clients can receive its 413 JSON response.
server.tomcat.max-swallow-size=6MB

# Comma-separated exact origins. Set this to the deployed frontend origin in production.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
